version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - nilerr

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
    paths:
      - examples
      - proto

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    paths:
      - examples
      - proto

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
