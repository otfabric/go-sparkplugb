name: Check Sparkplug Spec

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream proto
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/eclipse-tahu/tahu/refs/heads/develop/sparkplug_b/sparkplug_b.proto" \
            -o /tmp/upstream_sparkplug_b.proto

      - name: Compare SHA-256
        id: compare
        run: |
          PINNED="4432c5c483b7fb9732d0594c98a2e97dca5e517e39c5374a8b918d837f0b4a19"
          UPSTREAM=$(sha256sum /tmp/upstream_sparkplug_b.proto | awk '{print $1}')
          echo "pinned=${PINNED}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          if [ "${PINNED}" != "${UPSTREAM}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue if changed
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'spec-update',
            });
            if (existing.data.length > 0) {
              console.log('Issue already open, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sparkplug_b.proto has changed',
              body: [
                'The weekly spec check detected that the upstream `sparkplug_b.proto` has been updated.',
                '',
                `**Pinned SHA-256:** \`${{ steps.compare.outputs.pinned }}\``,
                `**Upstream SHA-256:** \`${{ steps.compare.outputs.upstream }}\``,
                '',
                'Source: https://github.com/eclipse-tahu/tahu/blob/develop/sparkplug_b/sparkplug_b.proto',
                '',
                'Action needed:',
                '1. Review the upstream changes',
                '2. Update `proto/sparkplug_b.proto` and regenerate',
                '3. Update the pinned hash in `.github/workflows/check-spec.yaml`',
              ].join('\n'),
              labels: ['spec-update'],
            });
