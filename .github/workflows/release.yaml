name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v3.8.0
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-sparkplugb
      test-exclude-regex: "(/example(s)?($|/)|/proto($|/))"
      update-major-tag: false
      # The modules that require go-sparkplugb, built and tested against the
      # candidate before it is tagged.
      consumers: |
        otfabric/sparkplugbctl
        otfabric/sparkplugb-interop:own/go-sparkplugb
    secrets: inherit
