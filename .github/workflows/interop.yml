name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-sparkplugb's edge node, host application and application against
# the reference implementations of otfabric/sparkplugb-interop (Eclipse Tahu,
# pysparkplug, SparkplugNet, srad, Eclipse Tahu sparkplug-client,
# sparkplughost), every role against every reference that has the other
# role, on every fixture and on every pinned broker. The images are consumed
# as published, by digest (interop/images.go): nothing of sparkplugb-interop
# is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      adapters:
        description: "Comma-separated subset of the references (default: all)"
        required: false

permissions:
  contents: read

env:
  GOWORK: "off"
  SPARKPLUGB_INTEROP_ADAPTERS: ${{ inputs.adapters }}
  # Keep in step with interop/images.go (TestWorkflowPins). The brokers come
  # from Google's mirror of Docker Hub, by the same digests: anonymous Docker
  # Hub pulls are rate limited per runner address.
  SPARKPLUGB_INTEROP_TAHU_IMAGE: ghcr.io/otfabric/sparkplugb-interop-tahu:v0.3.0@sha256:322127f8be82eb046abd28869eb47de6924b55288ab71fa6b011245d01ae5741
  SPARKPLUGB_INTEROP_PYSPARKPLUG_IMAGE: ghcr.io/otfabric/sparkplugb-interop-pysparkplug:v0.3.0@sha256:1405e89f83df743b9054cccff289d7c65a873626b104b45341caad3fa98c5855
  SPARKPLUGB_INTEROP_SPARKPLUGNET_IMAGE: ghcr.io/otfabric/sparkplugb-interop-sparkplugnet:v0.3.0@sha256:1a0aee704cf01a5b3d39d86201bba40b93e5df12cc5bca94a8bf340dca20a8ee
  SPARKPLUGB_INTEROP_SRAD_IMAGE: ghcr.io/otfabric/sparkplugb-interop-srad:v0.3.0@sha256:e56a9188e33845fb634bd5804ff129641b619a353c2d79c2548635d6c532df65
  SPARKPLUGB_INTEROP_TAHU_JS_IMAGE: ghcr.io/otfabric/sparkplugb-interop-tahu-js:v0.3.0@sha256:802bc5a2d574c981abf05bf58e077d261b18cf3237b8cfa0c2344441880dc2fb
  SPARKPLUGB_INTEROP_SPARKPLUGHOST_IMAGE: ghcr.io/otfabric/sparkplugb-interop-sparkplughost:v0.3.0@sha256:5ca0a074f7f8ef7b2480fb53f86151b673991415c10e804ba53168da5c82d807
  SPARKPLUGB_INTEROP_MOSQUITTO_IMAGE: mirror.gcr.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
  SPARKPLUGB_INTEROP_HIVEMQ_CE_IMAGE: mirror.gcr.io/hivemq/hivemq-ce:2026.5@sha256:bac6d4d1d815bffe4bc9a7fca8d06ea12b32d34f84ef2f1851ff4548560ee67b
  SPARKPLUGB_INTEROP_EMQX_IMAGE: mirror.gcr.io/emqx/emqx:6.3.2@sha256:135116400e11b25224350b2e55c874f4e224d357b593fb554ca1b1f398c631ac
  SPARKPLUGB_INTEROP_NANOMQ_IMAGE: mirror.gcr.io/emqx/nanomq:0.25.7@sha256:ed5a9bb892f58e59aa4e47a9932fb7e056f5ae57ba201414c793b8c961587784

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    name: ${{ matrix.broker }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        broker: [mosquitto, hivemq-ce, emqx, nanomq]
    env:
      SPARKPLUGB_INTEROP_BROKERS: ${{ matrix.broker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: interop/go.mod
          cache: true
          cache-dependency-path: interop/go.sum

      - name: Install linters
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0

      - name: Pull the reference and broker images
        run: |
          broker_var="SPARKPLUGB_INTEROP_$(echo "${{ matrix.broker }}" | tr 'a-z-' 'A-Z_')_IMAGE"
          images=("${SPARKPLUGB_INTEROP_TAHU_IMAGE}" "${SPARKPLUGB_INTEROP_PYSPARKPLUG_IMAGE}" "${SPARKPLUGB_INTEROP_SPARKPLUGNET_IMAGE}"
                  "${SPARKPLUGB_INTEROP_SRAD_IMAGE}" "${SPARKPLUGB_INTEROP_TAHU_JS_IMAGE}" "${SPARKPLUGB_INTEROP_SPARKPLUGHOST_IMAGE}"
                  "${!broker_var}")
          pull() {
            local attempt
            for attempt in 1 2 3 4 5; do
              docker pull --quiet "$1" && return 0
              [[ "${attempt}" == 5 ]] && return 1
              sleep $((attempt * 15))
            done
          }
          for image in "${images[@]::6}"; do
            pull "${image}" || { echo "::error::cannot pull ${image}"; exit 1; }
          done
          # The mirror does not always have every manifest: then the broker
          # comes from Docker Hub, by the same digest.
          if ! pull "${!broker_var}"; then
            ref="${!broker_var}"
            hub="docker.io/${ref#mirror.gcr.io/}"
            echo "::warning::mirror.gcr.io does not serve ${!broker_var}; pulling ${hub}"
            pull "${hub}" || { echo "::error::cannot pull ${hub}"; exit 1; }
            echo "${broker_var}=${hub}" >> "$GITHUB_ENV"
            images[6]="${hub}"
          fi
          {
            echo "| Image | Upstream |"
            echo "|---|---|"
            for image in "${images[@]::6}"; do
              echo "| \`${image}\` | $(docker run --rm "${image}" print-capabilities | jq -r '"\(.upstream.name) \(.upstream.version)"') |"
            done
            echo "| \`${images[6]}\` | broker |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: |
          set -o pipefail
          mkdir -p artifacts
          make interop INTEROP_TESTFLAGS=-v 2>&1 | tee artifacts/interop.log
          grep -E -- '--- (FAIL|SKIP)' artifacts/interop.log | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          docker images --digests > artifacts/docker-images.txt || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interop-${{ matrix.broker }}
          path: artifacts/
          if-no-files-found: ignore
