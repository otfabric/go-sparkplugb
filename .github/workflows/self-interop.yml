name: Self-interop
run-name: "Self-interop against sparkplugb-interop-otfabric:latest, by @${{ github.actor }} on ${{ github.ref_name }}"

# Manual only. This commit against the latest published image of go-sparkplugb itself
# (ghcr.io/otfabric/sparkplugb-interop-otfabric:latest, from otfabric/sparkplugb-interop),
# in both roles (edge node and primary host application), on Mosquitto. The e2e
# tests run both sides from one commit; this one finds a change on the wire that
# breaks an earlier release.
#
# Not part of the Interop workflow, which runs against the independent references,
# and never a required check. Nothing is pinned or committed, so it cannot ask for
# a release. A pass is not independent verification (INTEROPERABILITY.md).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/otfabric/sparkplugb-interop-otfabric:latest
  GOWORK: "off"
  # The broker of interop/images.go, from Google's mirror of Docker Hub by the
  # same digest, as in the Interop workflow.
  SPARKPLUGB_INTEROP_MOSQUITTO_IMAGE: mirror.gcr.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f

jobs:
  self-interop:
    name: This commit against sparkplugb-interop-otfabric:latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: interop/go.mod
          cache-dependency-path: interop/go.sum

      - name: Pull the image
        run: docker pull "${IMAGE}"

      - name: Versions
        id: versions
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        run: |
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Versions"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| go-sparkplugb under test | \`${REF}\` at \`${SHA}\` (\`$(git describe --tags --always)\`) |"
            echo "| Go | \`$(go env GOVERSION)\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo "| Image digest | \`${digest}\` |"
            echo "| Image reports | \`$(docker run --rm "${IMAGE}" version)\` |"
            docker run --rm "${IMAGE}" print-capabilities | jq -r '"| go-sparkplugb in the image | `\(.upstream.version)` |"'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        env:
          SPARKPLUGB_INTEROP_OTFABRIC_IMAGE: ${{ steps.versions.outputs.digest }}
          SPARKPLUGB_INTEROP_ADAPTERS: otfabric
          SPARKPLUGB_INTEROP_BROKERS: mosquitto
        working-directory: interop
        run: |
          set -o pipefail
          go test -v -tags interop -count=1 -timeout 25m ./ 2>&1 | tee interop.log
          {
            echo "## Result"
            echo
            echo "- $(grep -c -- '--- PASS' interop.log) passed, $(grep -c -- '--- SKIP' interop.log) skipped, $(grep -c -- '--- FAIL' interop.log) failed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
